name: Refresh tide data

on:
  schedule:
    # Runs Jan 1 and Jul 1 at midnight UTC
    - cron: '0 0 1 1,7 *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true # Faster binary package installs

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}-v1
          restore-keys: r-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "lubridate", "rtide", "dplyr", "readr",
            "stringr", "glue", "tidyr", "purrr"
          ))'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Clear Observable cache (forces R script to re-run)
        run: npm run clean

      - name: Build
        run: npm run build

      - name: Deploy to Observable
        run: npm run deploy
        env:
          OBSERVABLE_TOKEN: ${{ secrets.OBSERVABLE_TOKEN }}
